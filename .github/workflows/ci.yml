name: Verify and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server-web:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
  windows-agent:
    needs: server-web
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: npm run build
      - run: dotnet build agent/DeskLink.Agent -c Release
      - run: dotnet agent/DeskLink.Agent/bin/Release/net10.0-windows/DeskLink.Agent.dll --self-test
      - run: dotnet build agent/DeskLink.Agent.Integration -c Release
      - run: ./scripts/package-agent.ps1
      - run: dotnet build agent/DeskLink.DesktopProbe -c Release
      - run: npx playwright install chromium
      - name: Install package and exercise real desktop through web
        env:
          DESKLINK_VM_TEST: '1'
        run: npm run test:vm
      - name: Publish the exact tested package
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-release.ps1
