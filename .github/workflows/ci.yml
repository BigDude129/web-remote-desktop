name: Verify and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server-web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
  windows-agent:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build agent/DeskLink.Agent -c Release
      - run: dotnet agent/DeskLink.Agent/bin/Release/net10.0-windows/DeskLink.Agent.dll --self-test --skip-capture
      - run: dotnet build agent/DeskLink.Agent.Integration -c Release
      - run: ./scripts/package-agent.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DeskLink-Agent-win-x64
          path: |
            artifacts/DeskLink.Agent-*-win-x64.zip
            artifacts/agent-release.json
            artifacts/SHA256SUMS.txt
          retention-days: 7
  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [server-web, windows-agent]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: DeskLink-Agent-win-x64
          path: artifacts
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          notes="docs/releases/${RELEASE_TAG}.md"
          test -f "$notes"
          (cd artifacts && sha256sum --check SHA256SUMS.txt)
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > release-state.txt 2>/dev/null; then
            test "$(cat release-state.txt)" = "true" || { echo "Published releases are immutable in this workflow."; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "DeskLink ${RELEASE_TAG}" --notes-file "$notes"
          fi
          gh release upload "$RELEASE_TAG" artifacts/DeskLink.Agent-*-win-x64.zip artifacts/agent-release.json artifacts/SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
