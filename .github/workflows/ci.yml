name: Verify and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server-web:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
  windows-agent:
    needs: server-web
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
          cache: false
      - run: npm ci
      - run: npm run build
      - run: dotnet build agent/DeskLink.Agent -c Release
      - run: dotnet agent/DeskLink.Agent/bin/Release/net10.0-windows/DeskLink.Agent.dll --self-test
      - run: dotnet build agent/DeskLink.Agent.Integration -c Release
      - run: ./scripts/package-agent.ps1
      - run: dotnet build agent/DeskLink.DesktopProbe -c Release
      - run: npx playwright install chromium
      - name: Install package and exercise real desktop through web
        env:
          DESKLINK_VM_TEST: '1'
        run: npm run test:vm
      - name: Publish the exact tested package
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-release.ps1
